<style>
:root{
  --bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;
  --primary:#111827;--accent:#7c3aed;--accent2:#ede9fe;--green:#15803d;--red:#dc2626;
  --shadow:0 12px 32px rgba(15,23,42,.08);--radius:22px;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
button,input,select,textarea{font:inherit} button{cursor:pointer;border:0}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:96px}
header{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.92);backdrop-filter:blur(18px);padding:16px 18px 12px;border-bottom:1px solid rgba(229,231,235,.7)}
.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:22px}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:#fff;box-shadow:var(--shadow);font-size:20px}
main{padding:18px}
.page{display:none}.page.active{display:block}
.hero{background:linear-gradient(135deg,#111827,#312e81);color:#fff;border-radius:28px;padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;color:#dbe4ff;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.stat b{font-size:25px;display:block}.stat span{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 6px 20px rgba(15,23,42,.04)}
.card h2,.card h3{margin:0 0 12px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.btn{padding:11px 15px;border-radius:14px;background:#eef2f7;color:var(--text);font-weight:700}.btn.primary{background:var(--primary);color:#fff}.btn.purple{background:var(--accent);color:#fff}.btn.green{background:#dcfce7;color:#166534}.btn.red{background:#fee2e2;color:#991b1b}.btn.small{padding:8px 11px;font-size:12px}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 13px;outline:none}input:focus,select:focus,textarea:focus{border-color:#a78bfa;box-shadow:0 0 0 3px #ede9fe}
label{font-size:12px;font-weight:800;color:#475569;display:block;margin:10px 0 6px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
.searchbar{display:flex;gap:8px}.searchbar input{flex:1}.searchbar .btn{white-space:nowrap}
.result{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.result:last-child{border-bottom:0}
.cover{width:62px;height:86px;object-fit:cover;border-radius:9px;background:#e5e7eb;flex:none}.cover.big{width:90px;height:126px}
.meta{min-width:0;flex:1}.title{font-weight:900;line-height:1.35}.muted{color:var(--muted);font-size:12px;line-height:1.5}.tag{display:inline-block;background:#f1f5f9;border-radius:999px;padding:4px 8px;font-size:11px;margin:3px 3px 0 0}.tag.purple{background:var(--accent2);color:#5b21b6}
.empty{text-align:center;color:var(--muted);padding:28px 10px}.list{display:flex;flex-direction:column;gap:10px}
.bookrow{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);padding:10px 12px;border-radius:16px}.bookrow .cover{width:44px;height:62px}.bookrow .title{font-size:14px}
.progress{height:8px;background:#eef2f7;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bottom{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);height:76px;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;align-items:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav{background:transparent;color:#64748b;font-size:11px;font-weight:800;height:60px}.nav span{display:block;font-size:21px;margin-bottom:3px}.nav.active{color:#111827}
.addnav{position:relative}.addnav .plus{position:absolute;left:50%;top:-30px;transform:translateX(-50%);width:62px;height:62px;border-radius:22px;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 14px 30px rgba(124,58,237,.35);border:5px solid var(--bg)}
.addnav em{font-style:normal;position:relative;top:27px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:50;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:28px 28px 0 0;max-height:92vh;overflow:auto;padding:18px 18px 30px}
.handle{width:42px;height:5px;background:#d1d5db;border-radius:9px;margin:0 auto 15px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 15px;border-radius:999px;font-size:13px;z-index:100;display:none}.toast.show{display:block}
.switch{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.switch input{width:auto}
.camera{border:2px dashed #c4b5fd;background:#faf5ff;border-radius:18px;padding:18px;text-align:center}
.notice{font-size:12px;background:#f8fafc;border-radius:15px;padding:12px;color:#475569;line-height:1.6}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.sheet{border-radius:28px;margin-bottom:20px}.modal{align-items:center}.formgrid.three{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="top">
    <div><div class="brand">我的收藏櫃</div></div>
    <button class="iconbtn" onclick="openShare()">↗</button>
  </div>
</header>

<main>
<section id="home" class="page active">
  <div class="hero"><h1>記錄你每一個收藏</h1><p>搜尋書名／作者、掃 ISBN、記錄每一集的價格與收藏狀態。</p></div>
  <div class="grid">
    <div class="stat"><b id="sBooks">0</b><span>已收藏本數</span></div>
    <div class="stat"><b id="sSeries">0</b><span>收藏系列</span></div>
    <div class="stat"><b id="sSpend">$0</b><span>實際花費</span></div>
    <div class="stat"><b id="sWant">0</b><span>待購入</span></div>
  </div>
  <div class="card">
    <div class="row between"><h2>快速開始</h2><button class="btn purple" onclick="openAdd()">＋ 新增作品</button></div>
    <div class="row wrap">
      <button class="btn" onclick="openAdd('isbn')">▣ 掃 ISBN</button>
      <button class="btn" onclick="go('want')">想買清單</button>
      <button class="btn" onclick="go('stats')">看作者統計</button>
    </div>
  </div>
  <div class="card"><h2>收藏進度</h2><div id="homeSeries" class="list"></div></div>
</section>

<section id="books" class="page">
  <div class="row between"><div><h2>我的書櫃</h2><div class="muted">依作品分組顯示，點一下看每一集的價格與狀態。</div></div></div>
  <div class="card">
    <div class="searchbar"><input id="localSearch" placeholder="搜尋我的書櫃：書名／作者／ISBN" oninput="renderBooks()"><button class="btn" onclick="renderBooks()">搜尋</button></div>
    <div class="formgrid" style="margin-top:10px">
      <div><label>篩選</label><select id="bookFilter" onchange="renderBooks()"><option value="all">全部</option><option value="owned">已收藏</option><option value="unowned">待購入</option><option value="sell">待出售</option></select></div>
      <div><label>排序</label><select id="bookSort" onchange="renderBooks()"><option value="default">新增順序</option><option value="dateDesc">購入日期：新到舊</option><option value="dateAsc">購入日期：舊到新</option><option value="priceDesc">價格：高到低</option><option value="priceAsc">價格：低到高</option><option value="unownedFirst">未收藏優先</option></select></div>
    </div>
  </div>
  <div id="bookList" class="list"></div>
</section>

<section id="want" class="page">
  <div class="card"><h2>想買／待補集數</h2><div class="muted">可以把缺的單集留在這裡，之後一鍵轉成已購入。</div><div id="wantBudget" class="muted" style="margin-top:6px;font-weight:800"></div></div>
  <div id="wantList" class="list"></div>
</section>

<section id="stats" class="page">
  <div class="card"><h2>收藏統計</h2><div id="statsSummary"></div></div>
  <div class="card"><h3>作者</h3><div id="authorStats"></div></div>
  <div class="card"><h3>分類／類型</h3><div id="catStats"></div></div>
</section>
</main>

<nav class="bottom">
  <button class="nav active" data-page="home" onclick="go('home')"><span>⌂</span>首頁</button>
  <button class="nav" data-page="books" onclick="go('books')"><span>▣</span>書櫃</button>
  <button class="nav addnav" onclick="openAdd()"><div class="plus">＋</div><em>新增</em></button>
  <button class="nav" data-page="want" onclick="go('want')"><span>♡</span>想買</button>
  <button class="nav" data-page="stats" onclick="go('stats')"><span>◔</span>統計</button>
</nav>
</div>

<div id="modal" class="modal"><div class="sheet" style="position:relative">
  <button class="iconbtn" style="position:absolute;top:14px;right:14px;width:34px;height:34px;font-size:15px;z-index:5" onclick="confirmCloseModal()">✕</button>
  <div class="handle"></div><div id="modalBody"></div>
</div></div>
<div id="toast" class="toast"></div>
<input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(this)">

<script>
const KEY='paperBooksV2';
function uid(){return (crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2))}
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
  series:[], share:{enabled:false,slug:'',showPrices:false}, friends:[]
};
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function parseVolumeTokens(input){
 let out=[];
 (input||'').split(/[,，、]/).map(t=>t.trim()).filter(Boolean).forEach(t=>{
  let m=t.match(/^(\d+)\s*[-~到至]\s*(\d+)$/);
  if(m){
   let a=parseInt(m[1],10),b=parseInt(m[2],10);
   if(!isNaN(a)&&!isNaN(b)&&a<=b&&(b-a)<=300){for(let i=a;i<=b;i++)out.push(String(i))}
   else out.push(t)
  } else out.push(t)
 });
 return out.length?out:['']
}
function money(v){if(v===null||v===undefined||v==='')return '—';return '$'+Number(v).toLocaleString('zh-TW',{maximumFractionDigits:2})}
function resizeImageFile(file,maxW=500,quality=0.82){
 return new Promise((resolve,reject)=>{
  let reader=new FileReader();
  reader.onload=e=>{
   let img=new Image();
   img.onload=()=>{
    let scale=Math.min(1,maxW/img.width);
    let w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
    let canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    resolve(canvas.toDataURL('image/jpeg',quality))
   };
   img.onerror=()=>reject(new Error('圖片讀取失敗'));
   img.src=e.target.result
  };
  reader.onerror=()=>reject(new Error('圖片讀取失敗'));
  reader.readAsDataURL(file)
 })
}
async function handleCoverFile(inputEl,targetId){
 let f=inputEl.files&&inputEl.files[0];if(!f)return;
 try{let dataUrl=await resizeImageFile(f);document.getElementById(targetId).value=dataUrl;toast('封面已更新（來自相簿）')}
 catch(e){toast('圖片讀取失敗，請改用網址')}
 finally{inputEl.value=''}
}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));renderAll()}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function confirmCloseModal(){
 let body=document.getElementById('modalBody');
 let hasInput=Array.from(body.querySelectorAll('input[type="text"],input:not([type]),input[type="number"],input[type="date"],textarea')).some(el=>el.value && String(el.value).trim()!=='');
 if(hasInput && !confirm('要放棄目前輸入的內容嗎？'))return;
 closeModal()
}
function showModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')}

function renderAll(){renderHome();renderBooks();renderWant();renderStats()}
function renderHome(){
 let vols=db.series.flatMap(s=>s.volumes||[]), owned=vols.filter(v=>v.owned), spend=owned.reduce((a,v)=>a+Number(v.purchasePrice||0),0);
 document.getElementById('sBooks').textContent=owned.length;
 document.getElementById('sSeries').textContent=db.series.length;
 document.getElementById('sSpend').textContent=money(spend);
 document.getElementById('sWant').textContent=vols.filter(v=>!v.owned).length;
 document.getElementById('homeSeries').innerHTML=db.series.length?db.series.map(s=>{
   let o=(s.volumes||[]).filter(v=>v.owned).length,total=(s.volumes||[]).length,pct=total?Math.round(o/total*100):0;
   return `<div class="bookrow" onclick="openSeries('${s.id}')"><img class="cover" src="${esc(s.cover||'')}" onerror="this.style.visibility='hidden'"><div class="meta"><div class="title">${esc(s.title)}</div><div class="muted">${esc((s.authors||[]).join('、'))} · ${o}/${total} 本</div><div class="progress"><i style="width:${pct}%"></i></div></div><b>${pct}%</b></div>`
 }).join(''):'<div class="empty">還沒有收藏。按底部中央「＋ 新增」開始吧。</div>'
}
function renderBooks(){
 let q=(document.getElementById('localSearch')?.value||'').toLowerCase();
 let filter=document.getElementById('bookFilter')?.value||'all';
 let sortBy=document.getElementById('bookSort')?.value||'default';
 let rows=db.series.filter(s=>{
  if(q){
   let hitSeries=[s.title,...(s.authors||[])].join(' ').toLowerCase().includes(q);
   let hitVol=(s.volumes||[]).some(v=>[v.title,v.isbn13,v.isbn10].join(' ').toLowerCase().includes(q));
   if(!hitSeries && !hitVol)return false
  }
  if(filter==='owned')return (s.volumes||[]).some(v=>v.owned);
  if(filter==='unowned')return (s.volumes||[]).some(v=>!v.owned);
  if(filter==='sell')return (s.volumes||[]).some(v=>v.sell);
  return true
 });
 let spendOf=s=>(s.volumes||[]).reduce((a,v)=>a+Number(v.purchasePrice||v.listPrice||0),0);
 let lastDateOf=s=>(s.volumes||[]).map(v=>v.purchaseDate||'').sort().slice(-1)[0]||'';
 let ratioOf=s=>{let t=(s.volumes||[]).length,o=(s.volumes||[]).filter(v=>v.owned).length;return t?o/t:1};
 if(sortBy==='dateDesc')rows.sort((a,b)=>lastDateOf(b).localeCompare(lastDateOf(a)));
 else if(sortBy==='dateAsc')rows.sort((a,b)=>lastDateOf(a).localeCompare(lastDateOf(b)));
 else if(sortBy==='priceDesc')rows.sort((a,b)=>spendOf(b)-spendOf(a));
 else if(sortBy==='priceAsc')rows.sort((a,b)=>spendOf(a)-spendOf(b));
 else if(sortBy==='unownedFirst')rows.sort((a,b)=>ratioOf(a)-ratioOf(b));
 document.getElementById('bookList').innerHTML=rows.length?rows.map(s=>{
  let total=(s.volumes||[]).length,owned=(s.volumes||[]).filter(v=>v.owned).length,sell=(s.volumes||[]).filter(v=>v.sell).length,pct=total?Math.round(owned/total*100):0;
  return `<div class="bookrow" onclick="openSeries('${s.id}')"><img class="cover" src="${esc(s.cover||'')}" onerror="this.style.visibility='hidden'"><div class="meta"><div class="title">${esc(s.title)}</div><div class="muted">${esc((s.authors||[]).join('、'))} · ${owned}/${total} 本${sell?` · ${sell} 本待出售`:''}</div><div class="progress"><i style="width:${pct}%"></i></div></div><b>${pct}%</b></div>`
 }).join(''):'<div class="empty">找不到符合的作品。</div>'
}
function renderWant(){
 let rows=[];db.series.forEach(s=>(s.volumes||[]).filter(v=>!v.owned).forEach(v=>rows.push({s,v})));
 let order={高:0,中:1,低:2};
 rows.sort((a,b)=>(order[a.v.priority||'中']??1)-(order[b.v.priority||'中']??1));
 let budget=rows.reduce((a,{v})=>a+Number(v.listPrice||0),0);
 document.getElementById('wantBudget').textContent=rows.length?`待購預算合計（依參考價）：${money(budget)}`:'';
 document.getElementById('wantList').innerHTML=rows.length?rows.map(({s,v})=>`<div class="card"><div class="row"><img class="cover" src="${esc(v.cover||s.cover||'')}" onerror="this.style.visibility='hidden'"><div class="meta"><div class="title">${esc(s.title)} ${v.volumeNo?`· 第 ${esc(v.volumeNo)} 集`:''}</div><div class="muted">${esc((s.authors||[]).join('、'))} · ISBN ${esc(v.isbn13||v.isbn10||'—')}</div><div class="muted">參考價：${money(v.listPrice)}　實際購入價：尚未購入</div>${v.notes?`<div class="muted">備註：${esc(v.notes)}</div>`:''}<span class="tag ${v.priority==='高'?'purple':''}">優先：${esc(v.priority||'中')}</span></div></div><div class="row" style="margin-top:10px"><button class="btn green small" onclick="buyVolume('${s.id}','${v.id}')">標記已購入</button><button class="btn small" onclick="openSeries('${s.id}')">查看系列</button></div></div>`).join(''):'<div class="empty">目前沒有待購入單集。</div>'
}
function renderStats(){
 let vols=db.series.flatMap(s=>s.volumes||[]),owned=vols.filter(v=>v.owned);
 document.getElementById('statsSummary').innerHTML=`<div class="grid"><div class="stat"><b>${owned.length}</b><span>已收藏本數</span></div><div class="stat"><b>${db.series.length}</b><span>收藏系列</span></div><div class="stat"><b>${new Set(db.series.flatMap(s=>s.authors||[])).size}</b><span>作者</span></div><div class="stat"><b>${money(owned.reduce((a,v)=>a+Number(v.purchasePrice||0),0))}</b><span>實際花費</span></div></div>`;
 let amap={};db.series.forEach(s=>(s.authors||['未填作者']).forEach(a=>{if(!amap[a])amap[a]={books:0,series:0};amap[a].series++;amap[a].books+=(s.volumes||[]).filter(v=>v.owned).length}));
 document.getElementById('authorStats').innerHTML=Object.entries(amap).sort((a,b)=>b[1].books-a[1].books).map(([a,x])=>`<div class="bookrow"><div class="meta"><div class="title">${esc(a)}</div><div class="muted">已收藏 ${x.books} 本 · ${x.series} 個系列</div></div><b>${x.books}</b></div>`).join('')||'<div class="empty">還沒有資料。</div>';
 let cmap={};db.series.forEach(s=>(s.category||'未分類').split(',').forEach(c=>{c=c.trim();cmap[c]=(cmap[c]||0)+(s.volumes||[]).filter(v=>v.owned).length}));
 document.getElementById('catStats').innerHTML=Object.entries(cmap).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<div class="switch"><span>${esc(c)}</span><b>${n} 本</b></div>`).join('')||'<div class="empty">還沒有分類資料。</div>'
}

function openAdd(mode='search'){
 showModal(`<h2>新增作品</h2>
 <div class="notice">可用書名、作者或 ISBN 搜尋網路書目。搜尋到後會自動帶入標題、作者、出版社、語言、ISBN、出版日、分類、封面、頁數與可取得的參考價格；最後仍建議你確認「台灣紙本版本」是否正確。</div>
 ${location.protocol==='file:'?'<div class="notice" style="background:#fff7ed;color:#9a3412;margin-top:8px">⚠️ 這個頁面目前是用本機檔案（file://）打開的。部分瀏覽器會限制本機檔案對外連線，如果搜尋一直失敗，可以試試把這個檔案放到雲端硬碟／簡易網頁空間後用網址開啟，或直接使用「手動新增」。</div>':''}
 <label>搜尋書名／作者／ISBN</label><div class="searchbar"><input id="apiQ" placeholder="例如：相反的你和我／阿賀沢紅茶／9786264342674" oninput="debouncedApiSearch()" onkeydown="if(event.key==='Enter'){clearTimeout(apiTimer);apiSearch()}"><button class="btn purple" onclick="clearTimeout(apiTimer);apiSearch()">搜尋</button></div>
 <div id="scanArea" style="display:${mode==='isbn'?'block':'none'};margin-top:12px"></div>
 <div id="apiResults" style="margin-top:10px"></div>
 <div class="card" style="margin-top:14px;background:#fafafa"><h3>或直接手動建立</h3><button class="btn" onclick="openEditor({})">手動新增</button></div>`)
 if(mode==='isbn')startScanner()
}
let apiTimer=null,apiSeq=0;
function debouncedApiSearch(){
 clearTimeout(apiTimer);
 let q=document.getElementById('apiQ').value.trim();
 if(q.length<2){document.getElementById('apiResults').innerHTML='';return}
 apiTimer=setTimeout(apiSearch,450)
}
async function fetchBooks(q,restrictTW=true){
 let ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),9000);
 try{
  let url='https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=20&printType=books&orderBy=relevance'+(restrictTW?'&country=TW':'');
  let r=await fetch(url,{signal:ctrl.signal});
  if(!r.ok)throw new Error('Google Books HTTP '+r.status);
  let data=await r.json();
  return (data.items||[]).map(x=>normalizeBook(x))
 } finally { clearTimeout(timer) }
}
async function fetchFromOpenLibrary(q){
 let ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),9000);
 try{
  let url='https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&limit=20';
  let r=await fetch(url,{signal:ctrl.signal});
  if(!r.ok)throw new Error('Open Library HTTP '+r.status);
  let data=await r.json();
  return (data.docs||[]).map(d=>({
   title:d.title||'',subtitle:'',authors:d.author_name||[],publisher:(d.publisher||[])[0]||'',
   language:(d.language||[])[0]||'',category:(d.subject||[]).slice(0,3).join(', '),
   publishedDate:d.first_publish_year?String(d.first_publish_year):'',
   isbn13:(d.isbn||[]).find(x=>x.length===13)||'',isbn10:(d.isbn||[]).find(x=>x.length===10)||'',
   cover:d.cover_i?`https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg`:'',
   pageCount:'',description:'',listPrice:''
  }))
 } finally { clearTimeout(timer) }
}
async function apiSearch(){
 let raw=document.getElementById('apiQ').value.trim();if(!raw)return;
 let mySeq=++apiSeq;
 document.getElementById('apiResults').innerHTML='<div class="empty">搜尋中…</div>';
 let q=raw.replace(/[\u3000]/g,' ').trim();
 let items=[],lastErr=null;
 try{
  items=await fetchBooks(q);
  if(!items.length && !/^isbn:/i.test(q)){
   // 沒有結果時，逐步放寬查詢
   let loose=q.replace(/[《》「」【】〈〉（）()／\/,，、\-–—]/g,' ').replace(/\s+/g,' ').trim();
   if(loose && loose!==q) items=await fetchBooks(loose);
   if(!items.length && loose) items=await fetchBooks(loose,false); // 拿掉台灣地區限制再試一次
   if(!items.length){
    // 中日韓文字通常沒有空白可斷詞，改成逐步縮短開頭幾個字再試
    let cjk=loose.replace(/\s+/g,'');
    if(/[\u3400-\u9fff]/.test(cjk)){
     let tried=new Set();
     for(let len of [6,4,3,2]){
      if(items.length)break;
      if(len>=cjk.length)continue;
      let piece=cjk.slice(0,len);
      if(piece.length<2||tried.has(piece))continue;
      tried.add(piece);
      items=await fetchBooks(piece,false)
     }
    } else {
     let firstTerm=loose.split(' ')[0];
     if(firstTerm && firstTerm.length>=2 && firstTerm!==loose) items=await fetchBooks(firstTerm,false);
    }
   }
  }
 }catch(e){lastErr=e}
 if(!items.length){
  try{items=await fetchFromOpenLibrary(q.replace(/^isbn:/i,''))}
  catch(e2){if(!lastErr)lastErr=e2}
 }
 if(mySeq!==apiSeq)return; // 有更新的搜尋已經送出，捨棄這次較舊的結果
 if(items.length){
  document.getElementById('apiResults').innerHTML=items.map((b,i)=>`<div class="result"><img class="cover" src="${esc(b.cover)}" onerror="this.style.visibility='hidden'"><div class="meta"><div class="title">${esc(b.title)}</div><div class="muted">${esc(b.authors.join('、'))}</div><div class="muted">${esc(b.publisher||'出版社未提供')} · ${esc(b.publishedDate||'出版日未提供')} · ${esc(b.language||'語言未提供')}</div><div class="muted">ISBN：${esc(b.isbn13||b.isbn10||'未提供')} · ${b.pageCount||'—'} 頁</div><div><span class="tag purple">${esc(b.category||'未分類')}</span>${b.listPrice!==''?`<span class="tag">參考價 ${money(b.listPrice)}</span>`:''}</div><button class="btn small purple" style="margin-top:7px" onclick='openEditor(${JSON.stringify(b)})'>使用這筆資料</button></div></div>`).join('')
 } else if(lastErr){
  let hint=lastErr.name==='AbortError'?'搜尋逾時，請確認網路連線':esc(lastErr.message||String(lastErr));
  document.getElementById('apiResults').innerHTML=`<div class="empty">網路搜尋失敗（${hint}）。請確認網路連線，或改用手動新增。</div>`
 } else {
  document.getElementById('apiResults').innerHTML='<div class="empty">查不到結果。可以換作者名、ISBN，或手動新增。</div>'
 }
}
function normalizeBook(x){
 let v=x.volumeInfo||{},ids=v.industryIdentifiers||[],p=ids.find(i=>i.type==='ISBN_13')?.identifier||'',i10=ids.find(i=>i.type==='ISBN_10')?.identifier||'';
 return {title:v.title||'',subtitle:v.subtitle||'',authors:v.authors||[],publisher:v.publisher||'',language:v.language||'',category:(v.categories||[]).join(', '),publishedDate:v.publishedDate||'',isbn13:p,isbn10:i10,cover:(v.imageLinks?.thumbnail||v.imageLinks?.smallThumbnail||'').replace('http:','https:'),pageCount:v.pageCount||'',description:v.description||'',listPrice:(x.saleInfo?.listPrice?.amount??x.saleInfo?.retailPrice?.amount??'')};
}
function findDuplicate(b){
 let isbn=(b.isbn13||b.isbn10||'').trim();
 let title=(b.title||'').trim().toLowerCase();
 for(let s of db.series){
  if(isbn){
   let hit=(s.volumes||[]).find(v=>(v.isbn13&&v.isbn13===isbn)||(v.isbn10&&v.isbn10===isbn));
   if(hit)return s
  }
  if(title && (s.title||'').trim().toLowerCase()===title)return s
 }
 return null
}
function openEditor(b){
 let id=b.id||uid();
 let dup=b.title?findDuplicate(b):null;
 showModal(`<h2>${b.title?'確認書目':'手動新增作品'}</h2>
 ${dup?`<div class="notice" style="background:#fff7ed;color:#9a3412;margin-bottom:10px">⚠️ 書櫃裡似乎已經有「${esc(dup.title)}」了（書名或 ISBN 相符）。<br><button class="btn small" style="margin-top:8px" onclick="closeModal();openSeries('${dup.id}')">查看該系列</button></div>`:''}
 <div class="formgrid">
 <div class="full"><label>系列／作品名稱</label><input id="fTitle" value="${esc(b.title||'')}"></div>
 <div><label>作者</label><input id="fAuthor" value="${esc((b.authors||[]).join('、'))}"></div>
 <div><label>出版社</label><input id="fPublisher" value="${esc(b.publisher||'')}"></div>
 <div><label>語言</label><input id="fLang" value="${esc(b.language||'')}"></div>
 <div><label>分類／類型</label><input id="fCat" value="${esc(b.category||'')}"></div>
 <div><label>ISBN-13</label><input id="fISBN13" value="${esc(b.isbn13||'')}"></div>
 <div><label>ISBN-10</label><input id="fISBN10" value="${esc(b.isbn10||'')}"></div>
 <div><label>出版日</label><input id="fDate" value="${esc(b.publishedDate||'')}"></div>
 <div><label>頁數</label><input id="fPages" type="number" value="${esc(b.pageCount||'')}"></div>
 <div class="full"><label>封面 URL 或從相簿上傳</label><input id="fCover" value="${esc(b.cover||'')}">
 <input type="file" accept="image/*" style="margin-top:8px" onchange="handleCoverFile(this,'fCover')"></div>
 <div class="full"><label>第一批要建立的單集／卷次（可輸入範圍，如 1-12；可輸入 25.5、特別篇等）</label><input id="fVol" value="1"></div>
 <div><label>參考／原價</label><input id="fList" type="number" step="0.01" value="${esc(b.listPrice??'')}"></div>
 <div><label>實際購入價</label><input id="fBuy" type="number" step="0.01" value=""></div>
 <div><label>折扣</label><input id="fDiscount" type="number" step="0.01" placeholder="例如 0.8 或 20"></div>
 <div><label>優先順序（想買清單用）</label><select id="fPriority"><option value="中">中</option><option value="高">高</option><option value="低">低</option></select></div>
 <div class="full"><label>備註</label><input id="fNotes" placeholder="例如：簽名版、特典附錄"></div>
 </div>
 <div class="switch"><span>這一集已購入</span><input id="fOwned" type="checkbox" checked></div>
 <div class="switch"><span>標記為待出售</span><input id="fSell" type="checkbox"></div>
 <button class="btn purple" style="width:100%;margin-top:14px" onclick='createSeries(${JSON.stringify(b)})'>建立作品＋第一集</button>`)
}
function createSeries(b){
 let s={id:uid(),title:document.getElementById('fTitle').value.trim(),authors:document.getElementById('fAuthor').value.split(/[,、]/).map(x=>x.trim()).filter(Boolean),publisher:document.getElementById('fPublisher').value.trim(),language:document.getElementById('fLang').value.trim(),category:document.getElementById('fCat').value.trim(),cover:document.getElementById('fCover').value.trim(),pages:document.getElementById('fPages').value,createdAt:new Date().toISOString(),volumes:[]};
 if(!s.title){toast('請輸入作品名稱');return}
 let tokens=parseVolumeTokens(document.getElementById('fVol').value.trim()||'1');
 let owned=document.getElementById('fOwned').checked,sell=document.getElementById('fSell').checked,today=new Date().toISOString().slice(0,10);
 let listPrice=document.getElementById('fList').value,purchasePrice=document.getElementById('fBuy').value,discount=document.getElementById('fDiscount').value,priority=document.getElementById('fPriority').value,notes=document.getElementById('fNotes').value.trim(),cover=document.getElementById('fCover').value.trim(),language=document.getElementById('fLang').value.trim(),isbn13=document.getElementById('fISBN13').value.trim(),isbn10=document.getElementById('fISBN10').value.trim(),publishedDate=document.getElementById('fDate').value.trim();
 tokens.forEach((no,i)=>{
  s.volumes.push({id:uid(),volumeNo:no,title:tokens.length===1?(b.subtitle||''):'',isbn13:tokens.length===1?isbn13:'',isbn10:tokens.length===1?isbn10:'',publishedDate:tokens.length===1?publishedDate:'',cover,language,listPrice,purchasePrice,discount,priority,notes,owned,sell,purchaseDate:owned?today:''})
 });
 db.series.unshift(s);save();closeModal();toast(tokens.length>1?`已加入書櫃，共建立 ${tokens.length} 集`:'已加入書櫃')}
function openSeries(id){
 let s=db.series.find(x=>x.id===id);if(!s)return;
 showModal(`<div class="row"><img class="cover big" src="${esc(s.cover||'')}" onerror="this.style.visibility='hidden'"><div class="meta"><h2>${esc(s.title)}</h2><div class="muted">${esc((s.authors||[]).join('、'))}</div><div class="muted">${esc(s.publisher||'')} · ${esc(s.language||'')} · ${esc(s.category||'未分類')}</div></div></div>
 <div class="row wrap" style="margin:15px 0"><button class="btn purple" onclick="addVolume('${s.id}')">＋ 新增單集</button><button class="btn" onclick="shareSeries('${s.id}')">分享這個系列</button></div>
 <div class="list">${(s.volumes||[]).map(v=>`<div class="card"><div class="row"><img class="cover" src="${esc(v.cover||s.cover||'')}" onerror="this.style.visibility='hidden'"><div class="meta"><div class="title">第 ${esc(v.volumeNo||'—')} 集 ${v.title?'· '+esc(v.title):''}</div><div class="muted">ISBN：${esc(v.isbn13||v.isbn10||'—')} · ${esc(v.publishedDate||'出版日未填')}</div><div class="muted">參考價 ${money(v.listPrice)} · 實付 ${money(v.purchasePrice)} · 折扣 ${esc(v.discount||'—')}</div>${v.notes?`<div class="muted">備註：${esc(v.notes)}</div>`:''}${!v.owned?`<span class="tag">優先：${esc(v.priority||'中')}</span>`:''}</div></div><div class="row wrap" style="margin-top:10px"><button class="btn small ${v.owned?'green':'purple'}" onclick="toggleOwned('${s.id}','${v.id}')">${v.owned?'已購入':'標記購入'}</button><button class="btn small" onclick="editVolume('${s.id}','${v.id}')">編輯價格</button><button class="btn small red" onclick="deleteVolume('${s.id}','${v.id}')">刪除</button></div></div>`).join('')}</div>`)
}
function addVolume(sid){let s=db.series.find(x=>x.id===sid);showModal(`<h2>新增單集</h2>
<div class="notice">卷次／單集可以一次輸入多集，例如「1-12」代表第 1 到 12 集，或「1,3,5-8」混合輸入。其餘欄位（價格、封面、優先順序等）會套用到每一集，之後可再個別調整；ISBN 與出版日只有輸入單一集數時才會用到。</div>
<div class="formgrid">
<div class="full"><label>卷次／單集（可輸入範圍，如 1-12）</label><input id="nvNo" placeholder="例如 2、25.5、特別篇，或 1-12"></div>
<div><label>ISBN-13（僅單一集數時使用）</label><input id="nvISBN"></div>
<div><label>出版日（僅單一集數時使用）</label><input id="nvDate"></div>
<div><label>參考／原價（套用到每一集）</label><input id="nvList" type="number" step="0.01"></div>
<div><label>實際購入價（套用到每一集）</label><input id="nvBuy" type="number" step="0.01"></div>
<div><label>折扣</label><input id="nvDisc" type="number" step="0.01"></div>
<div><label>優先順序（想買清單用）</label><select id="nvPriority"><option value="中">中</option><option value="高">高</option><option value="低">低</option></select></div>
<div class="full"><label>備註（套用到每一集）</label><input id="nvNotes" placeholder="例如：簽名版、特典附錄"></div>
<div class="full"><label>封面 URL 或從相簿上傳（套用到每一集）</label><input id="nvCover" value="${esc(s.cover||'')}">
<input type="file" accept="image/*" style="margin-top:8px" onchange="handleCoverFile(this,'nvCover')"></div></div>
<div class="switch"><span>已購入（套用到每一集）</span><input id="nvOwned" type="checkbox"></div>
<button class="btn purple" style="width:100%;margin-top:12px" onclick="saveNewVolume('${sid}')">加入單集</button>`) }
function saveNewVolume(sid){
 let s=db.series.find(x=>x.id===sid);
 let tokens=parseVolumeTokens(document.getElementById('nvNo').value.trim());
 let owned=document.getElementById('nvOwned').checked,today=new Date().toISOString().slice(0,10);
 let listPrice=document.getElementById('nvList').value,purchasePrice=document.getElementById('nvBuy').value,discount=document.getElementById('nvDisc').value,priority=document.getElementById('nvPriority').value,notes=document.getElementById('nvNotes').value.trim(),cover=document.getElementById('nvCover').value,isbn13=document.getElementById('nvISBN').value.trim(),publishedDate=document.getElementById('nvDate').value.trim();
 tokens.forEach((no,i)=>{
  s.volumes.push({id:uid(),volumeNo:no,isbn13:tokens.length===1?isbn13:'',publishedDate:tokens.length===1?publishedDate:'',listPrice,purchasePrice,discount,priority,notes,cover,owned,sell:false,purchaseDate:owned?today:''})
 });
 save();openSeries(sid);toast(tokens.length>1?`已新增 ${tokens.length} 集`:'已加入單集')
}
function editVolume(sid,vid){let s=db.series.find(x=>x.id===sid),v=s.volumes.find(x=>x.id===vid);showModal(`<h2>編輯第 ${esc(v.volumeNo)} 集</h2><div class="formgrid">
<div><label>ISBN-13</label><input id="evISBN" value="${esc(v.isbn13||'')}"></div><div><label>出版日</label><input id="evDate2" value="${esc(v.publishedDate||'')}"></div>
<div><label>參考／原價</label><input id="evList" type="number" step="0.01" value="${esc(v.listPrice||'')}"></div><div><label>實際購入價</label><input id="evBuy" type="number" step="0.01" value="${esc(v.purchasePrice||'')}"></div>
<div><label>折扣</label><input id="evDisc" type="number" step="0.01" value="${esc(v.discount||'')}"></div><div><label>購入日期</label><input id="evDate" type="date" value="${esc(v.purchaseDate||'')}"></div>
<div><label>優先順序（想買清單用）</label><select id="evPriority"><option value="中" ${!v.priority||v.priority==='中'?'selected':''}>中</option><option value="高" ${v.priority==='高'?'selected':''}>高</option><option value="低" ${v.priority==='低'?'selected':''}>低</option></select></div>
<div class="full"><label>備註</label><input id="evNotes" value="${esc(v.notes||'')}"></div>
</div><div class="switch"><span>待出售</span><input id="evSell" type="checkbox" ${v.sell?'checked':''}></div><button class="btn purple" style="width:100%;margin-top:12px" onclick="saveEdit('${sid}','${vid}')">儲存</button>`) }
function saveEdit(sid,vid){let v=db.series.find(s=>s.id===sid).volumes.find(v=>v.id===vid);v.isbn13=document.getElementById('evISBN').value.trim();v.publishedDate=document.getElementById('evDate2').value.trim();v.listPrice=document.getElementById('evList').value;v.purchasePrice=document.getElementById('evBuy').value;v.discount=document.getElementById('evDisc').value;v.purchaseDate=document.getElementById('evDate').value;v.priority=document.getElementById('evPriority').value;v.notes=document.getElementById('evNotes').value.trim();v.sell=document.getElementById('evSell').checked;save();openSeries(sid)}
function toggleOwned(sid,vid){let v=db.series.find(s=>s.id===sid).volumes.find(v=>v.id===vid);v.owned=!v.owned;if(v.owned&&!v.purchaseDate)v.purchaseDate=new Date().toISOString().slice(0,10);save();openSeries(sid)}
function buyVolume(sid,vid){let v=db.series.find(s=>s.id===sid).volumes.find(v=>v.id===vid);v.owned=true;showModal(`<h2>記錄購入價格</h2><label>實際購入價（可輸入小數）</label><input id="quickBuy" type="number" step="0.01" placeholder="例如 25.5"><label>折扣</label><input id="quickDisc" type="number" step="0.01"><button class="btn purple" style="width:100%;margin-top:12px" onclick="finishBuy('${sid}','${vid}')">完成</button>`)}
function finishBuy(sid,vid){let v=db.series.find(s=>s.id===sid).volumes.find(v=>v.id===vid);v.purchasePrice=document.getElementById('quickBuy').value;v.discount=document.getElementById('quickDisc').value;v.purchaseDate=new Date().toISOString().slice(0,10);save();closeModal();toast('已更新購入紀錄')}
function deleteVolume(sid,vid){if(!confirm('確定刪除這一集？'))return;let s=db.series.find(x=>x.id===sid);s.volumes=s.volumes.filter(v=>v.id!==vid);if(!s.volumes.length)db.series=db.series.filter(x=>x.id!==sid);save();closeModal()}
function openShare(){showModal(`<h2>分享我的書櫃</h2><div class="notice">目前這個 V2 是單機原型。真正跨裝置、好友互動與分享連結需要接上雲端帳號；這裡先把隱私規則與操作流程做進介面。</div>
<div class="switch"><span>開啟書櫃分享</span><input id="shareOn" type="checkbox" ${db.share.enabled?'checked':''}></div>
<div class="switch"><span>公開「購入價格／折扣」</span><input id="sharePrice" type="checkbox" ${db.share.showPrices?'checked':''}></div>
<div class="card"><h3>預設公開</h3><div class="muted">書名、封面、作者、收藏進度</div><h3 style="margin-top:12px">預設私人</h3><div class="muted">實際購入價、折扣、購入日期、出售標記</div></div>
<button class="btn purple" style="width:100%" onclick="saveShare()">儲存分享設定</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
<h3>好友互動（預覽）</h3><div class="row wrap"><button class="btn" onclick="toast('好友邀請功能將在雲端版啟用')">＋ 邀請好友</button><button class="btn" onclick="toast('共同收藏比較將在雲端版啟用')">比較共同收藏</button></div>
<hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
<h3>備份與還原</h3><div class="muted" style="margin-bottom:10px">資料只存在這台裝置的瀏覽器裡，建議定期匯出備份。</div>
<div class="row wrap"><button class="btn" onclick="exportData()">⬇︎ 匯出備份 JSON</button><button class="btn" onclick="document.getElementById('importFile').click()">⬆︎ 匯入備份 JSON</button></div>`)}
function saveShare(){db.share.enabled=document.getElementById('shareOn').checked;db.share.showPrices=document.getElementById('sharePrice').checked;if(db.share.enabled&&!db.share.slug)db.share.slug=Math.random().toString(36).slice(2,9);save();closeModal();toast(db.share.enabled?'分享已開啟（本機預覽）':'分享已關閉')}
function shareSeries(sid){toast('已準備系列分享預覽；雲端版可產生真正分享連結')}
function importData(inputEl){
 let f=inputEl.files&&inputEl.files[0];if(!f)return;
 let reader=new FileReader();
 reader.onload=e=>{
  try{
   let data=JSON.parse(e.target.result);
   if(!data||!Array.isArray(data.series))throw new Error('格式錯誤');
   if(!confirm(`確定要匯入嗎？將合併 ${data.series.length} 筆作品到目前的書櫃（不會刪除現有資料，重複的 id 會略過）。`))return;
   let existingIds=new Set(db.series.map(s=>s.id)),added=0;
   data.series.forEach(s=>{if(!existingIds.has(s.id)){db.series.push(s);added++}});
   save();toast(`已匯入 ${added} 筆作品`);closeModal()
  }catch(err){toast('匯入失敗，請確認是本 App 匯出的備份檔')}
 };
 reader.readAsText(f);
 inputEl.value=''
}
function loadScript(src){
 return new Promise((resolve,reject)=>{
  if(document.querySelector(`script[data-src="${src}"]`)){resolve();return}
  let s=document.createElement('script');s.src=src;s.dataset.src=src;
  s.onload=()=>resolve();s.onerror=()=>reject(new Error('load failed'));
  document.head.appendChild(s)
 })
}
function startScanner(){
 let area=document.getElementById('scanArea');if(!area)return;
 if('BarcodeDetector' in window){
  area.innerHTML='<div class="camera"><b>ISBN 掃描</b><p class="muted">將 ISBN-13 條碼放進框內。掃到後會自動查詢書目。</p><video id="scanVideo" playsinline autoplay muted style="width:100%;border-radius:14px;background:#111"></video><br><button class="btn" onclick="stopScanner()">停止掃描</button></div>';
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}}).then(stream=>{window.scanStream=stream;let v=document.getElementById('scanVideo');v.srcObject=stream;window.detector=new BarcodeDetector({formats:['ean_13','code_128']});scanLoop(v)}).catch(()=>manualISBN());
  return
 }
 // 這個瀏覽器沒有原生條碼掃描 API，改用 ZXing 函式庫掃描
 area.innerHTML='<div class="camera">正在載入掃描元件…</div>';
 loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js').then(()=>{
  area.innerHTML='<div class="camera"><b>ISBN 掃描</b><p class="muted">將 ISBN-13 條碼放進框內。掃到後會自動查詢書目。</p><video id="scanVideo" playsinline autoplay muted style="width:100%;border-radius:14px;background:#111"></video><br><button class="btn" onclick="stopScanner()">停止掃描</button></div>';
  let reader=new ZXing.BrowserMultiFormatReader();
  window.zxingReader=reader;
  reader.decodeFromVideoDevice(null,'scanVideo',(result,err)=>{
   if(result){let raw=result.getText();stopScanner();document.getElementById('apiQ').value='isbn:'+raw;apiSearch()}
  }).catch(()=>manualISBN())
 }).catch(()=>{area.innerHTML='<div class="camera">你的瀏覽器不支援條碼掃描，且掃描元件載入失敗（可能沒有網路）。<br><br><button class="btn" onclick="manualISBN()">改用 ISBN 手動輸入</button></div>'})
}
async function scanLoop(video){if(!window.scanStream)return;try{let codes=await window.detector.detect(video);if(codes.length){let raw=codes[0].rawValue;stopScanner();document.getElementById('apiQ').value='isbn:'+raw;apiSearch();return}}catch(e){}requestAnimationFrame(()=>scanLoop(video))}
function stopScanner(){
 if(window.scanStream){window.scanStream.getTracks().forEach(t=>t.stop());window.scanStream=null}
 if(window.zxingReader){try{window.zxingReader.reset()}catch(e){}window.zxingReader=null}
}
function manualISBN(){document.getElementById('scanArea').innerHTML=`<label>輸入 ISBN</label><div class="searchbar"><input id="manualIsbn"><button class="btn purple" onclick="document.getElementById('apiQ').value='isbn:'+document.getElementById('manualIsbn').value;apiSearch()">查詢</button></div>`}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='我的紙本書櫃_backup.json';a.click()}
renderAll();
</script>
</body>
